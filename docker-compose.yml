services:
  sdf:
    image: ghcr.io/aries6955/sdf:latest
    container_name: sdf
    restart: unless-stopped
    ports:
      - "8536:8536"
    # 所有配置都在 .env 里改,不在这里写死
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 宿主 ${SDF_DATA:-/root/sdf-data} 挂到容器的 /data;换目录改环境变量或这里
      - ${SDF_DATA:-/root/sdf-data}:/data
