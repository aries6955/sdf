[project]
name = "sdf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "fpdf2>=2.9.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
