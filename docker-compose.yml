services:
  sdf:
    image: ghcr.io/aries6955/sdf:latest
    container_name: sdf
    restart: unless-stopped
    ports:
      - "8536:8536"
    # 所有配置都在 .env 里改,不在这里写死
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 数据与配置同在项目目录,不往宿主其他位置写;要换盘就改绝对路径
      - ./data:/data
